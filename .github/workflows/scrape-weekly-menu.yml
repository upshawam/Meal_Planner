name: Scrape Weekly Menu

on:
  schedule:
    # Run every Monday at 6 AM UTC (when new EveryPlate menus typically post)
    - cron: '0 6 * * 1'
  workflow_dispatch: # Allow manual trigger
    inputs:
      week:
        description: 'Specific week number to scrape (leave empty for current week)'
        required: false
        type: number
      force:
        description: 'Force overwrite existing week data'
        required: false
        type: boolean
        default: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Allow pushing commits back to the repo
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0               # full history so git operations work reliably
          persist-credentials: true    # allow pushing with the provided token
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      
      - name: Install ChromeDriver
        uses: nanasess/setup-chromedriver@v2
      
      - name: Scrape current week menu
        if: ${{ !inputs.week }}
        run: |
          echo "🍽️ Starting current week scrape..."
          echo "Force mode: ${{ inputs.force }}"
          python scrape_week.py ${{ inputs.force && '--force' || '' }}
          echo "✅ Scrape complete"
      
      - name: Scrape specific week
        if: ${{ inputs.week }}
        run: |
          echo "🍽️ Starting scrape for week ${{ inputs.week }}..."
          python scrape_specific_week.py ${{ inputs.week }}
          echo "✅ Scrape complete"
      
      - name: Download and enrich with PDFs
        run: |
          echo "📥 Step 2: Downloading and enriching with PDFs..."
          echo "Input: docs/week.json"
          echo "Output: docs/week_with_pdfs.json"
          python enrich_and_download_pdfs.py --input docs/week.json --output docs/week_with_pdfs.json --delay 0.5
          echo "✅ PDF enrichment complete"
      
      - name: Update archive and week.json with PDFs
        run: |
          echo "💾 Step 3: Archiving enriched data..."
          # Get week info from the enriched file
          WEEK_NUM=$(python -c "import json; data=json.load(open('docs/week_with_pdfs.json')); print(f\"{data['year']}-W{str(data['week']).zfill(2)}\")")
          echo "📅 Week identifier: $WEEK_NUM"
          echo "📂 Copying to archive: docs/weeks/$WEEK_NUM.json"
          # Copy enriched data to archive
          cp docs/week_with_pdfs.json "docs/weeks/$WEEK_NUM.json"
          echo "📂 Updating current week: docs/week.json"
          # Copy to week.json for frontend
          cp docs/week_with_pdfs.json docs/week.json
          echo "✅ Archive updated"
      
      - name: Validate week data
        run: |
          echo "✓ Step 4: Validating scraped data..."
          python validate_week_data.py
          echo "✅ Validation complete"
      
      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "📝 Step 5: Committing changes to repository..."
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          echo "📋 Adding files to git..."
          git add docs/week*.json docs/weeks/*.json docs/weeks_index.json docs/pdfs/*.pdf || true

          echo "💾 Checking for changes..."
          # If there are no staged or unstaged changes, skip push
          if git diff --quiet && git diff --staged --quiet; then
            echo "ℹ️  No changes to commit"
            exit 0
          fi

          echo "📤 Preparing commit..."
          git commit -m "🍽️ Auto-update weekly menu and PDFs [skip ci]" || {
            echo "⚠️ Nothing to commit (possibly staged changes changed); continuing"
          }

          # Ensure we have the latest remote main
          echo "🔄 Fetching latest origin/main..."
          git fetch origin main --tags

          # Rebase our changes on top of origin/main to avoid non-fast-forward errors.
          # Use autostash to preserve any local uncommitted changes (shouldn't be any).
          echo "🔁 Rebasing local commits onto origin/main..."
          if ! git rebase --autostash origin/main; then
            echo "❌ Rebase failed — aborting rebase and failing workflow for manual intervention."
            git rebase --abort || true
            echo "---- git status ----"
            git status --porcelain=2 --branch
            echo "---- recent commits local ----"
            git --no-pager log --oneline -n 20
            exit 1
          fi

          # Push the rebased commits to origin/main. Using HEAD:main ensures we push current branch to main.
          # Because we rebased, a normal push should succeed; if someone pushed concurrently, push will fail and the
          # workflow can be re-run.
          echo "📦 Pushing changes to origin/main..."
          git push origin HEAD:main

          echo "✅ All done! Check your repository for updates."
