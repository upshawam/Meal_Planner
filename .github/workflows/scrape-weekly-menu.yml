name: Scrape Weekly Menu
on:
  schedule:
    - cron: '0 5 * * 1' # run every Monday at 05:00 UTC (adjust as needed)
  workflow_dispatch:

permissions:
  contents: write  # allow the workflow to push changes

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0         # full history so git operations work reliably
          persist-credentials: true  # allow pushing with the provided token

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure branch is in sync with remote main (safe starting point)
        # this ensures the working copy starts exactly at origin/main,
        # which avoids push rejections caused by local divergence
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: (Optional) Install Chrome / ChromeDriver
        # keep whatever was necessary in your original workflow for scraping
        run: echo "Install Chrome & ChromeDriver steps if required by your scraper"

      - name: Scrape current week menu
        run: |
          # run your scraping script; replace with the actual command(s)
          python scripts/scrape_menu.py

      - name: Show git status and diff (debug)
        run: |
          git status --porcelain
          git --no-pager diff --staged || true
          git --no-pager diff || true

      - name: Commit changes
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          # add new/changed files only; adjust paths if needed
          git add docs/weeks docs/pdfs || true
          # Only commit if there are staged changes
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "CI: update scraped weekly menu and PDFs [skip ci]"
          fi

      - name: Pull remote changes (rebase) and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # If there were no commits made above, exit early (no push needed)
          if git rev-parse --verify --quiet HEAD >/dev/null 2>&1; then
            # Check if there are any commits on local not yet pushed
            LOCAL_UNPUSHED=$(git log --branches --not --remotes --oneline | wc -l)
          else
            LOCAL_UNPUSHED=0
          fi

          if [ "$LOCAL_UNPUSHED" -eq 0 ]; then
            echo "No local commits to push. Exiting."
            exit 0
          fi

          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

          # Make sure we have latest refs
          git fetch origin main

          # Rebase local commits on top of the current origin/main to avoid non-fast-forward errors
          # If rebase fails due to conflicts, abort and fail the job so it can be investigated.
          if ! git rebase origin/main; then
            echo "Rebase failed — aborting and printing info to help debugging"
            git rebase --abort || true
            echo "---- git status ----"
            git status --porcelain=2 --branch
            echo "---- recent commits local ----"
            git --no-pager log --oneline -n 20
            exit 1
          fi

          # Push the rebased commits. Using standard push should succeed after rebase.
          # If a concurrent push occurs, this will fail; you can rerun the workflow.
          git push origin main
