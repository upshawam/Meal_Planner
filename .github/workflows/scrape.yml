name: Scrape weekly menu & commit archives

on:
  schedule:
    - cron: '0 7 * * 1'  # weekly Monday 07:00 UTC (adjust as needed)
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run scraper
        env:
          PYTHONUNBUFFERED: 1
        run: |
          # Run scraper. Use --force if you want to overwrite existing archive for the current week.
          python scrape_week.py || true

      - name: Commit docs changes
        uses: EndBug/add-and-commit@v9
        with:
          message: "Automated: update weekly archive and latest week.json"
          add: "docs/*"
          author_name: "github-actions[bot]"
