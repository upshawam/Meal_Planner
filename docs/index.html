<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Weekly Meal Planner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Left Filter Sidebar -->
  <div id="filter-sidebar" class="filter-sidebar">
    <!-- Search bar moved to sidebar -->
    <div class="sidebar-search-container">
      <div class="sidebar-search-input-container">
        <input type="text" id="search-bar" class="search-bar" placeholder="Search recipes or ingredients..." />
        <button id="clear-search-btn" class="clear-search-btn" title="Clear search" style="display:none;">×</button>
      </div>
    </div>
    
    <div class="filter-actions" style="margin-bottom: 20px;">
      <button id="clear-filters-btn-top" class="clear-filters-btn">Clear All Filters</button>
    </div>
    
    <div class="filter-section">
      <h4>Cuisine</h4>
      <div class="filter-options" id="cuisine-filters"></div>
    </div>
    
    <div class="filter-section">
      <h4>Protein</h4>
      <div class="filter-options" id="protein-filters"></div>
    </div>
    
    <div class="filter-section">
      <h4>Meal Type</h4>
      <div class="filter-options" id="meal-type-filters"></div>
    </div>
    
    <div class="filter-section">
      <h4>Dietary</h4>
      <div class="filter-options" id="dietary-filters"></div>
    </div>
    
    <div class="filter-actions">
      <button id="clear-filters-btn" class="clear-filters-btn">Clear All Filters</button>
    </div>
  </div>
  
  <!-- Sidebar toggle button -->
  <button id="sidebar-toggle" class="sidebar-toggle" title="Toggle filters">
    <span class="toggle-icon">☰</span>
    <span class="toggle-text">Filters</span>
  </button>
  
  <div class="main-container">
  <div class="top-action" role="region" aria-label="Selection controls" id="top-action">
    <div class="top-left" style="display:flex;align-items:center;gap:18px;">
      <strong class="top-title">Weekly Menu</strong>
      <div class="week-selector" style="display:flex;align-items:center;gap:8px;">
        <button id="prev-week-btn" class="week-nav-btn" title="Previous week">←</button>
        <span style="color:#fff;font-weight:600;">Week:</span>
        <span id="current-week-display" style="color:#fff;font-weight:700;">46</span>
        <button id="next-week-btn" class="week-nav-btn" title="Next week">→</button>
      </div>
      <div class="filter-toggle" style="display:flex;align-items:center;gap:14px;">
        <button id="clear-btn-inline" class="clear-btn-inline" type="button">Clear All</button>
      </div>
    </div>
    <div class="top-right">
      <span id="top-selected-count" class="count muted">0 selected</span>
      <button id="top-next" class="btn primary" disabled>Next</button>
      <button id="top-back" class="btn secondary hidden">Back</button>
    </div>
  </div>

  <main>
    <section id="menu" class="grid" aria-live="polite"></section>
    <section aria-hidden="false">
      <!-- REMOVED the "My Week" header per request -->
      <div id="selected" class=""></div>
    </section>
  </main>

  <!-- Modal for details (start hidden) -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-content">
      <button id="modal-close" class="modal-close" aria-label="Close">×</button>
      <h2 id="modal-title"></h2>
      <p id="modal-subtitle" class="muted"></p>
      <p id="modal-desc"></p>
      <p id="modal-ingredients"></p>
      <div id="modal-actions" style="display:flex;gap:8px;align-items:center;margin-top:8px;">
        <a id="modal-link" target="_blank" rel="noopener">Open recipe</a>
        <button id="modal-view-pdf" class="secondary" style="display:none;">View PDF</button>
        <a id="modal-download" style="display:none;">Download PDF</a>
      </div>
      <div id="modal-pdf-viewer" style="margin-top:12px;display:none;">
        <div id="modal-pdf-message" class="muted" style="margin-bottom:8px;"></div>
        <div style="width:100%;height:60vh;background:#fff;border-radius:6px;overflow:hidden;">
          <iframe id="modal-pdf-iframe" src="" style="width:100%;height:100%;border:0;" title="PDF viewer"></iframe>
        </div>
      </div>
    </div>
    </div>
  </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
